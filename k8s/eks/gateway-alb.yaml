# Auto Mode 내장 Gateway API로 인터넷용 ALB를 만들고 cost-web으로 보낸다 (3단계의 NodePort 대신)
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eks
spec:
  controllerName: eks.amazonaws.com/gateway-alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: lb-configuration
  namespace: cost-report
spec:
  scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
  namespace: cost-report
spec:
  gatewayClassName: eks
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: lb-configuration
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
  namespace: cost-report
spec:
  parentRefs:
  - name: app-gateway
  rules:
  - backendRefs:
    - name: cost-web
      port: 80
