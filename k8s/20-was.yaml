apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-was
  namespace: cost-report
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: cost-was }
  template:
    metadata:
      labels: { app: cost-was }
    spec:
      containers:
      - name: was
        image: ghcr.io/seongwb/cost-was:1.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef: { name: cost-config }
        env:
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: cost-db-secret, key: DB_PASSWORD } }
        readinessProbe:
          httpGet: { path: /readyz, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cost-was
  namespace: cost-report
spec:
  type: ClusterIP
  selector: { app: cost-was }
  ports:
  - port: 8000
    targetPort: 8000
