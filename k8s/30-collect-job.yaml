apiVersion: batch/v1
kind: Job
metadata:
  name: cost-collect
  namespace: cost-report
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: collect
        image: ghcr.io/seongwb/cost-was:2.0
        command: ["python", "-m", "app.jobs.collect", "--days", "30"]
        envFrom:
        - configMapRef: { name: cost-config }
        env:
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: cost-db-secret, key: DB_PASSWORD } }
