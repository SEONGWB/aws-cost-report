apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-web
  namespace: cost-report
spec:
  replicas: 2
  selector:
    matchLabels: { app: cost-web }
  template:
    metadata:
      labels: { app: cost-web }
    spec:
      containers:
      - name: web
        image: ghcr.io/seongwb/cost-web:2.0
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: { path: /, port: 80 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cost-web
  namespace: cost-report
spec:
  type: NodePort
  selector: { app: cost-web }
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
